<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="umcaruje">
<title>umcaruje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fafafa; font-family: Geist, Arial, sans-serif; }
  main { min-height: 100svh; display: grid; position: relative; isolation: isolate; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .identity { align-self: end; justify-self: start; z-index: 1; margin: clamp(22px, 4.1vw, 68px); pointer-events: none; }
  h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(38px, 6vw, 96px); line-height: .95; letter-spacing: -.075em; margin: 0; font-weight: 700; }
  h1 span { color: #777; }
  nav { position: absolute; z-index: 1; top: max(24px, env(safe-area-inset-top)); right: max(24px, env(safe-area-inset-right)); }
  a, button { font: 11px/1.2 "Courier New", monospace; letter-spacing: .09em; color: #a8a8a8; }
  a { display: inline-block; padding: 10px; text-decoration: none; }
  a:hover, button:hover { color: #fff; }
  a:focus-visible, button:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
  button[hidden] { display: none; }
  button { position: absolute; z-index: 1; right: max(24px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); background: #000; border: 1px solid #363636; padding: 10px 12px; cursor: pointer; }
  canvas:active { cursor: grabbing; }
  @media (max-width: 480px) {
    nav { top: max(15px, env(safe-area-inset-top)); right: 12px; }
    button { right: 16px; bottom: max(20px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<main>
  <canvas aria-hidden="true"></canvas>
  <div class="identity"><h1>umcaruje</h1></div>
  <button type="button" hidden>PAUSE</button>
</main>
<script>
  const canvas = document.querySelector("canvas");
  const context = canvas.getContext("2d");
  const button = document.querySelector("button");
  const motion = matchMedia("(prefers-reduced-motion: reduce)");
  const { PI, sin, cos, max, min, exp } = Math;
  const curves = [];
  const shades = [
    "rgba(255,255,255,.045)", "rgba(255,255,255,.095)", "rgba(255,255,255,.19)",
    "rgba(255,255,255,.34)", "rgba(255,255,255,.57)", "rgba(255,255,255,.85)"
  ];

  // Two distinct cerebral hemispheres, separated by the longitudinal fissure.
  // A broad crown and tapered lower lobes keep the silhouette anatomical.
  function surface(side, latitude, theta) {
    const y = sin(latitude), r = cos(latitude);
    const front = sin(theta);
    const fold = .028 * sin(theta * 15 + latitude * 13)
      + .018 * sin(theta * 25 - latitude * 9);
    const lobe = 1 + .10 * y - .13 * max(0, -y);
    return [
      side * (.055 + .79 * r * front * lobe + fold * r * front),
      .80 * y + .035 * r * sin(theta * 3) - .035 * front,
      .69 * r * cos(theta) * (1 + fold) + .05 * y
    ];
  }

  function addCurve(side, sample, weight, seed) {
    const points = [];
    for (let step = 0; step <= 100; step++) points.push(surface(side, ...sample(step / 100)));
    curves.push({ points, weight, seed, projected: new Float32Array(points.length * 3) });
  }

  for (const side of [-1, 1]) {
    // Interlocking, winding gyri instead of circular loops or a globe grid.
    for (let row = 0; row < 19; row++) {
      const base = -1.38 + row * 2.76 / 18;
      for (let edge = 0; edge < 2; edge++) {
        addCurve(side, u => {
          const a = u * PI;
          const winding = .082 * sin(7 * a + row * .91)
            + .035 * sin(15 * a - row * .62)
            + .018 * sin(23 * a + row);
          return [base + cos(base) * sin(a) * winding + edge * .026, a];
        }, row % 3 === 0 ? 1 : .5, row * .17 + edge * .024 + side * .31);
      }
    }
    // Strong medial outline makes the split between hemispheres unmistakable.
    for (const theta of [0, .065, PI - .065, PI]) {
      addCurve(side, u => [-PI / 2 + u * PI, theta], 1, theta + side);
    }
    // Short crossing sulci break the regular bands into organic regions.
    for (let column = 1; column < 8; column++) {
      const a = column * PI / 8;
      for (let part = 0; part < 3; part++) {
        addCurve(side, u => {
          const lat = -1.18 + part * .79 + u * .56;
          return [lat, a + .06 * sin(lat * 13 + column)];
        }, .5, column * .21 + part);
      }
    }
  }

  let width, height, scale, centerX, centerY, pixelRatio;
  let paused = motion.matches;
  let frameId = 0;
  let previousTime = 0;
  let seconds = 0;
  let targetYaw = 0, targetPitch = 0, yaw = 0, pitch = 0;
  let drag = null;
  const bins = shades.map(() => new Path2D());
  const stars = Array.from({ length: 55 }, (_, i) => [
    ((i * .61803398875) % 1), ((i * .41421356237) % 1), i % 13 === 0
  ]);

  function draw() {
    context.clearRect(0, 0, width, height);
    for (const [x, y, bright] of stars) {
      context.fillStyle = bright ? "#555" : "#222";
      context.fillRect(Math.round(x * width), Math.round(y * height), 1, 1);
    }

    // A slow, monochrome corona radiates out from the brain.
    const halo = context.createRadialGradient(centerX, centerY, scale * .45, centerX, centerY, scale * 1.7);
    halo.addColorStop(0, "rgba(255,255,255,0)");
    halo.addColorStop(.35, "rgba(255,255,255,.035)");
    halo.addColorStop(1, "rgba(255,255,255,0)");
    context.fillStyle = halo;
    context.fillRect(0, 0, width, height);
    for (let ray = 0; ray < 92; ray++) {
      const angle = ray * PI * 2 / 92 + .018 * sin(seconds * .3 + ray);
      const wave = .5 + .5 * sin(seconds * 1.4 - ray * .71);
      const inner = scale * (1.04 + .09 * sin(ray * 7.3));
      const outer = inner + scale * (.05 + .22 * Math.pow(wave, 3));
      context.beginPath();
      context.moveTo(centerX + cos(angle) * inner, centerY + sin(angle) * inner * .88);
      context.lineTo(centerX + cos(angle) * outer, centerY + sin(angle) * outer * .88);
      context.strokeStyle = "rgba(255,255,255," + (.035 + .23 * wave) + ")";
      context.lineWidth = ray % 7 === 0 ? 1.1 : .55;
      context.stroke();
      if (ray % 4 === 0) {
        const travel = (seconds * .12 + ray * .618) % 1;
        const radius = scale * (1.04 + travel * .65);
        context.fillStyle = "rgba(255,255,255," + ((1 - travel) * .5) + ")";
        context.fillRect(centerX + cos(angle) * radius, centerY + sin(angle) * radius * .88, 1.2, 1.2);
      }
    }
    const turn = .12 + .32 * sin(seconds * .28) + yaw;
    const tilt = -.38 + .08 * cos(seconds * .31) + pitch;
    const ct = cos(turn), st = sin(turn), cp = cos(tilt), sp = sin(tilt);
    const pulse = 1 + .012 * sin(seconds * 2.4);
    const scanCenter = centerY + sin(seconds * .83) * .75 * scale;
    const scanFalloff = 38 / (scale * scale);
    for (let i = 0; i < bins.length; i++) bins[i] = new Path2D();
    const sparks = new Path2D();
    for (const curve of curves) {
      const screen = curve.projected;
      for (let i = 0; i < curve.points.length; i++) {
        const [x, y, z] = curve.points[i];
        const rotatedX = ct * x + st * z;
        const depth = -st * x + ct * z;
        const rotatedY = cp * y - sp * depth;
        const rotatedZ = sp * y + cp * depth;
        const zoom = scale * pulse / (1 - .2 * rotatedZ);
        const offset = i * 3;
        screen[offset] = centerX + zoom * rotatedX;
        screen[offset + 1] = centerY - zoom * rotatedY;
        screen[offset + 2] = rotatedZ;
      }
      for (let i = 3; i < screen.length; i += 3) {
        const depth = (screen[i - 1] + screen[i + 2]) * .5;
        const scanDistance = screen[i + 1] - scanCenter;
        const scan = exp(-scanDistance * scanDistance * scanFalloff);
        const signal = sin(i * .030 - seconds * 3.1 + curve.seed * 12);
        const level = max(0, min(5, Math.floor(1.42 + depth * 4.65 + curve.weight * 1.1 + scan * 1.8 + max(0, signal) * .56)));
        bins[level].moveTo(screen[i - 3], screen[i - 2]);
        bins[level].lineTo(screen[i], screen[i + 1]);
        if (curve.weight && depth > .32 && i % 15 === 0 && signal > .985) {
          sparks.moveTo(screen[i] + 1.3, screen[i + 1]);
          sparks.arc(screen[i], screen[i + 1], 1.3, 0, PI * 2);
        }
      }
    }
    context.lineCap = "round";
    for (let i = 0; i < bins.length; i++) {
      context.strokeStyle = shades[i];
      context.lineWidth = i > 3 ? 1.05 : .7;
      context.stroke(bins[i]);
    }
    context.shadowBlur = 16;
    context.shadowColor = "#fff";
    context.strokeStyle = "rgba(255,255,255,.39)";
    context.stroke(bins[5]);
    context.fillStyle = "#fff";
    context.fill(sparks);
    context.shadowBlur = 0;
  }

  function resize() {
    ({ width, height } = canvas.getBoundingClientRect());
    pixelRatio = min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    centerX = width * .5;
    centerY = height * .455;
    scale = min(height * .29, width * .34);
    draw();
  }

  function animate(now) {
    const elapsed = previousTime ? min((now - previousTime) / 1000, .04) : 0;
    previousTime = now;
    seconds += elapsed;
    const easing = 1 - exp(-elapsed * 9);
    yaw += (targetYaw - yaw) * easing;
    pitch += (targetPitch - pitch) * easing;
    draw();
    frameId = requestAnimationFrame(animate);
  }

  function syncMotion() {
    button.textContent = paused ? "PLAY" : "PAUSE";
    cancelAnimationFrame(frameId);
    previousTime = 0;
    if (!paused && !document.hidden) frameId = requestAnimationFrame(animate);
  }

  if (context) {
    button.hidden = false;
    button.addEventListener("click", () => { paused = !paused; syncMotion(); });
    motion.addEventListener("change", () => { paused = motion.matches; syncMotion(); });
    document.addEventListener("visibilitychange", syncMotion);
    new ResizeObserver(resize).observe(canvas);
    canvas.addEventListener("pointerdown", event => {
      if (paused || !event.isPrimary || event.button !== 0) return;
      drag = { x: event.clientX, y: event.clientY, yaw: targetYaw, pitch: targetPitch };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", event => {
      if (!drag || paused || !event.isPrimary) return;
      targetYaw = drag.yaw + (event.clientX - drag.x) * .009;
      targetPitch = max(-1.4, min(1.4, drag.pitch + (event.clientY - drag.y) * .009));
    });
    canvas.addEventListener("lostpointercapture", () => { drag = null; });
    resize();
    syncMotion();
  }
</script>
</body>
</html>
