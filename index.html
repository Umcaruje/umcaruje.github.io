<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="umcaruje">
<title>umcaruje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: #fafafa; font-family: Geist, Arial, sans-serif; }
  main { min-height: 100svh; display: grid; position: relative; isolation: isolate; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .identity { align-self: end; justify-self: start; z-index: 1; margin: clamp(22px, 4.1vw, 68px); pointer-events: none; }
  h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(38px, 6vw, 96px); line-height: .95; letter-spacing: -.075em; margin: 0; font-weight: 700; }
  h1 span { color: #777; }
  nav { position: absolute; z-index: 1; top: max(24px, env(safe-area-inset-top)); right: max(24px, env(safe-area-inset-right)); }
  a, button { font: 11px/1.2 "Courier New", monospace; letter-spacing: .09em; color: #a8a8a8; }
  a { display: inline-block; padding: 10px; text-decoration: none; }
  a:hover, button:hover { color: #fff; }
  a:focus-visible, button:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
  button[hidden] { display: none; }
  button { position: absolute; z-index: 1; right: max(24px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); background: #000; border: 1px solid #363636; padding: 10px 12px; cursor: pointer; }
  canvas:active { cursor: grabbing; }
  @media (max-width: 480px) {
    nav { top: max(15px, env(safe-area-inset-top)); right: 12px; }
    button { right: 16px; bottom: max(20px, env(safe-area-inset-bottom)); }
  }
.status { position:absolute;top:45%;left:0;right:0;text-align:center;font:11px monospace;letter-spacing:.15em;color:#999;pointer-events:none; }
.credits {position:absolute;top:22px;right:24px;z-index:2;font:10px/1.6 monospace;color:#666;max-width:260px;text-align:right;}
.credits summary {cursor:pointer;list-style:none;}
.credits p {background:#080808;padding:12px;border:1px solid #222;}
.credits a {font:inherit;letter-spacing:0;padding:0;color:#999;}
</style>
</head>
<body>
<main>
  <canvas aria-label="Anatomical brain with glowing white contours rotating 360 degrees" role="img"></canvas>
<p class="status" role="status">LOADING BRAIN</p>
<details class="credits"><summary aria-label="3D model credits">© 3D</summary><p>Model: Z-Anatomy / BodyParts3D © DBCLS, via <a href="https://github.com/itayinbarr/brainproject">Brain Project</a>.<br><a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. Selected surfaces, rescaled and rendered in monochrome.</p></details>
  <div class="identity"><h1>umcaruje</h1></div>
  <button type="button" hidden>PAUSE</button>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const canvas=document.querySelector('canvas'), button=document.querySelector('button'), status=document.querySelector('.status');
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let paused=motion.matches, loaded=false, time=0, last=0, dragging=false, lastX=0;
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setClearColor(0x000000);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(36,1,.1,50);
camera.position.set(0,.25,7.5);camera.lookAt(0,0,0);
const root=new THREE.Group();root.rotation.set(.08,-Math.PI/2,0);scene.add(root);
const uniforms={uTime:{value:0}};
const material=new THREE.ShaderMaterial({
uniforms,
vertexShader:`
varying vec3 vNormal; varying vec3 vView; varying vec3 vPosition;
void main(){
 vPosition=position;
 vec4 view=modelViewMatrix*vec4(position,1.);
 vNormal=normalize(normalMatrix*normal);vView=-view.xyz;
 gl_Position=projectionMatrix*view;
}`,
fragmentShader:`
uniform float uTime;
varying vec3 vNormal; varying vec3 vView; varying vec3 vPosition;
void main(){
 vec3 n=normalize(vNormal),v=normalize(vView);
 float rim=pow(1.-abs(dot(n,v)),3.2);
 float light=max(0.,dot(n,normalize(vec3(-.4,.7,1.))));
 float bands=abs(sin(vPosition.y*90.+vPosition.x*3.));
 float line=1.-smoothstep(.06,.18,bands);
 float sweep=exp(-pow((vPosition.y-sin(uTime*.65)*1.5)*7.,2.));
 float shade=.028+pow(light,2.)*.16;
 float ink=shade+rim*.62+line*(.12+light*.25)+sweep*(line*.6+rim*.3);
 gl_FragColor=vec4(vec3(ink),1.);
}`
});
const decoder=new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
const loader=new GLTFLoader().setDRACOLoader(decoder);
const modelPath='itayinbarr/brainproject@2929e94f521a8ddceab26bc100a98dc06b0da060/brain-atlas/models/brain.glb';
async function start(){
 let gltf;
 try { gltf=await loader.loadAsync('https://cdn.jsdelivr.net/gh/'+modelPath); }
 catch { gltf=await loader.loadAsync('https://raw.githubusercontent.com/itayinbarr/brainproject/2929e94f521a8ddceab26bc100a98dc06b0da060/brain-atlas/models/brain.glb'); }
 gltf.scene.updateMatrixWorld(true);
 const meshes=[], bounds=new THREE.Box3();
 gltf.scene.traverse(o=>{
  if(!o.isMesh)return;
  const ex=o.userData.bx_cat?o.userData:(o.parent?.userData||{});
  if(!['cortex','cerebellum','brainstem'].includes(ex.bx_cat))return;
  // Flatten only the visible anatomical surfaces, preserving their world transforms.
  const geometry=o.geometry.clone().applyMatrix4(o.matrixWorld);
  geometry.computeBoundingBox();bounds.union(geometry.boundingBox);
  meshes.push(geometry);
 });
 if(!meshes.length)throw new Error('No anatomical surface meshes found');
 const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
 const scale=2.6/Math.max(size.x,size.y,size.z);
 for(const geometry of meshes){
  geometry.translate(-center.x,-center.y,-center.z);geometry.scale(scale,scale,scale);
  if(!geometry.attributes.normal)geometry.computeVertexNormals();
  root.add(new THREE.Mesh(geometry,material));
 }
 loaded=true;status.hidden=true;button.hidden=false;syncButton();render();decoder.dispose();
}
const particleCount=150,positions=new Float32Array(particleCount*3),seeds=[];
for(let i=0;i<particleCount;i++){
 const y=1-2*(i+.5)/particleCount,a=i*2.399963;
 seeds.push(new THREE.Vector3(Math.sqrt(1-y*y)*Math.cos(a),y,Math.sqrt(1-y*y)*Math.sin(a)));
}
const particleGeometry=new THREE.BufferGeometry();
particleGeometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
const particles=new THREE.Points(particleGeometry,new THREE.PointsMaterial({color:0xffffff,size:.009,transparent:true,opacity:.45,depthWrite:false}));
scene.add(particles);
function render(){
 uniforms.uTime.value=time;
 for(let i=0;i<particleCount;i++){
  const p=seeds[i],r=1.55+((time*.10+i*.618)%1)*.65;
  positions[i*3]=p.x*r;positions[i*3+1]=p.y*r*.85;positions[i*3+2]=p.z*r;
 }
 particleGeometry.attributes.position.needsUpdate=true;
 renderer.render(scene,camera);
}
function resize(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 renderer.setSize(w,h,false);camera.aspect=w/h;
 camera.position.z=camera.aspect<.8?10:7.5;camera.updateProjectionMatrix();render();
}
function syncButton(){button.textContent=paused?'PLAY':'PAUSE';button.setAttribute('aria-label',paused?'Play brain rotation':'Pause brain rotation');}
button.addEventListener('click',()=>{paused=!paused;syncButton();});
motion.addEventListener('change',()=>{paused=motion.matches;syncButton();});
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;root.rotation.y+=(e.clientX-lastX)*.008;lastX=e.clientX;render();});
canvas.addEventListener('lostpointercapture',()=>{dragging=false;});
document.addEventListener('visibilitychange',()=>{last=0;});
new ResizeObserver(resize).observe(canvas);
renderer.setAnimationLoop(now=>{
 const dt=last?Math.min((now-last)/1000,.04):0;last=now;
 if(document.hidden||!loaded)return;
 if(!paused){time+=dt;if(!dragging)root.rotation.y+=dt*.20;render();}
});
resize();
start().catch(error=>{console.error(error);status.textContent='Brain could not load. Refresh to retry.';});
</script>
</body>
</html>
